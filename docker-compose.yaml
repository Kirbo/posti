services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: posti
      MYSQL_USER: posti
      MYSQL_PASSWORD: posti
    ports:
      - "3306:3306"
    tmpfs:
      - /var/lib/mysql

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: posti
      MYSQL_USER: posti
      MYSQL_PASSWORD: posti
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: posti
      POSTGRES_USER: posti
      POSTGRES_PASSWORD: posti
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
