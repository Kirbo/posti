image: node:24-slim

stages:
  - version
  - install
  - test
  - build
  - integration
  - release
  - publish

variables:
  PNPM_HOME: /root/.local/share/pnpm
  PATH: /root/.local/share/pnpm:$PATH

.setup_pnpm: &setup_pnpm
  before_script:
    - corepack enable
    - corepack install
    - pnpm config set store-dir .pnpm-store

# ==============================================================================
# SCHEDULED PIPELINE: Dependency Audit
# ==============================================================================

audit:
  stage: install
  <<: *setup_pnpm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit

# ==============================================================================
# MAIN PIPELINE
# ==============================================================================

# --- Version (dry-run semantic release) ---
bump-version:
  stage: version
  image: registry.gitlab.com/go-semantic-release/semantic-release:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - semantic-release --dry-run --allow-initial-development
  artifacts:
    paths:
      - CHANGELOG.md
      - .unreleased-version
    expire_in: 1 day

# --- Install Dependencies ---
install:
  stage: install
  <<: *setup_pnpm
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules
    expire_in: 1 day
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store

# --- Lint & Type Check ---
lint:
  stage: test
  <<: *setup_pnpm
  needs: [install]
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - pnpm lint
    - pnpm typecheck

# --- Unit Tests ---
unit-tests:
  stage: test
  <<: *setup_pnpm
  needs: [install]
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - pnpm test:unit
  artifacts:
    paths:
      - coverage
    expire_in: 1 month

# --- Build (Compile TypeScript) ---
build:
  stage: build
  <<: *setup_pnpm
  needs: [install, unit-tests, lint]
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

# --- Integration Tests ---
.integration_base: &integration_base
  stage: integration
  <<: *setup_pnpm
  needs: [install, build]
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  timeout: 30m

integration-mysql:
  <<: *integration_base
  services:
    - name: mysql:8
      alias: mysql
  variables:
    MYSQL_DATABASE: posti
    MYSQL_USER: posti
    MYSQL_PASSWORD: posti
    MYSQL_ROOT_PASSWORD: root
    POSTI_HOST: mysql
    POSTI_PORT: "3306"
    POSTI_USER: posti
    POSTI_PASSWORD: posti
    POSTI_DATABASE: posti
  script:
    - pnpm vitest run test/integration/mysql.test.ts

integration-mariadb:
  <<: *integration_base
  services:
    - name: mariadb:11
      alias: mariadb
  variables:
    MYSQL_DATABASE: posti
    MYSQL_USER: posti
    MYSQL_PASSWORD: posti
    MYSQL_ROOT_PASSWORD: root
    POSTI_HOST: mariadb
    POSTI_PORT: "3306"
    POSTI_USER: posti
    POSTI_PASSWORD: posti
    POSTI_DATABASE: posti
  script:
    - pnpm vitest run test/integration/mariadb.test.ts

integration-postgresql:
  <<: *integration_base
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: posti
    POSTGRES_USER: posti
    POSTGRES_PASSWORD: posti
    POSTI_HOST: postgres
    POSTI_PORT: "5432"
    POSTI_USER: posti
    POSTI_PASSWORD: posti
    POSTI_DATABASE: posti
  script:
    - pnpm vitest run test/integration/postgres.test.ts

integration-sqlite:
  <<: *integration_base
  script:
    - pnpm vitest run test/integration/sqlite.test.ts

# --- GitLab Release ---
release:
  stage: release
  image: registry.gitlab.com/go-semantic-release/semantic-release:latest
  needs:
    - bump-version
    - integration-mysql
    - integration-mariadb
    - integration-postgresql
    - integration-sqlite
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
  script:
    - semantic-release --allow-initial-development

# --- Publish to npm ---
publish-npm:
  stage: publish
  <<: *setup_pnpm
  needs: [build, bump-version, release]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
  script:
    - |
      if [ -f .unreleased-version ]; then
        VERSION=$(cat .unreleased-version)
        npm version "$VERSION" --no-git-tag-version
        pnpm publish --access public --no-git-checks
      else
        echo "No unreleased version found, skipping publish"
      fi
